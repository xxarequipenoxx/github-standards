apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
  labels:
    app.kubernetes.io/name: fixture
    app.kubernetes.io/part-of: github-standards
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: ghcr.io/xxarequipenoxx/fixture-container:0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 16Mi

# Fixture for python-uv.yml: a minimal uv-managed package with one test that runs on
# SQLite and, when TEST_DATABASE_URL is set by the workflow, on PostgreSQL too.
[project]
name = "fixture-python"
version = "0.0.0"
description = "Fixture exercised by the python-uv reusable workflow"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.0.0", "ruff==0.15.3", "mypy==1.19.1"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["fixture_python"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fixture_python"]

default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
  # The shared hooks of this repository, run from the working tree so a change to hooks/ is
  # exercised before it is released. Same ids and entries as .pre-commit-hooks.yaml.
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution in the commit message
        entry: hooks/no-ai-attribution.sh
        language: script
        stages: [commit-msg]
      - id: sops-encrypted
        name: sops files are encrypted
        entry: hooks/sops-encrypted.sh
        language: script
        files: '\.sops\.ya?ml$'

name: security

# Reusable: gitleaks on the commits of the pull request range (full history on other
# events) and zizmor on .github/workflows. Both produce SARIF; the upload to code scanning
# is opt-in because private repositories need GitHub Code Security for it, which GitHub
# Pro does not include. Without upload, findings are printed and fail the job.
#
# Status check names: <caller job id> / gitleaks, <caller job id> / zizmor
# Caller permissions: contents: read, security-events: write

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the jobs that can run on a self-hosted runner (callers pass their RUNNER_LABEL repository variable, ADR 0010 of platform-infra); empty means ubuntu-latest
        type: string
        required: false
        default: ""
      sarif-upload:
        description: Upload SARIF results to code scanning (requires GitHub Code Security on private repositories)
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    # The release binary, not the container image: a self-hosted runner has no Docker (ADR 0010).
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning when sarif-upload is true
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_<version>_checksums.txt of the release, linux_x64 archive.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan the commits with gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [[ -n "${BASE_SHA}" && -n "${HEAD_SHA}" ]]; then
            log_opts=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          else
            echo "No pull request range: scanning the full history"
          fi
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          gitleaks git "${log_opts[@]}" \
            --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path "${RUNNER_TEMP}/gitleaks/results.sarif" \
            "${GITHUB_WORKSPACE}"

      - name: Upload the gitleaks SARIF to code scanning
        if: inputs.sarif-upload
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/gitleaks/results.sarif
          category: gitleaks

      - name: Fail when leaks were found
        run: |
          count="$(jq '.runs[0].results | length' "${RUNNER_TEMP}/gitleaks/results.sarif")"
          if [[ "${count}" -gt 0 ]]; then
            echo "::error::gitleaks found ${count} potential secret(s); see the job log (values are redacted)"
            exit 1
          fi
          echo "gitleaks: no leaks found"

  zizmor:
    name: zizmor
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning when sarif-upload is true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows
          # With upload enabled the action uploads SARIF itself and does not fail on findings
          # (code scanning is the gate); without it, findings are annotated and fail the job.
          advanced-security: ${{ inputs.sarif-upload }}
          annotations: ${{ !inputs.sarif-upload }}

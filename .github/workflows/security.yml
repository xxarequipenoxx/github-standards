name: security

# Reusable: gitleaks on the commits of the pull request range (full history on other
# events) and zizmor on .github/workflows. Both produce SARIF; the upload to code scanning
# is opt-in because private repositories need GitHub Code Security for it, which GitHub
# Pro does not include. Without upload, findings are printed and fail the job.
#
# Status check names: <caller job id> / gitleaks, <caller job id> / zizmor
# Caller permissions: contents: read, security-events: write

on:
  workflow_call:
    inputs:
      sarif-upload:
        description: Upload SARIF results to code scanning (requires GitHub Code Security on private repositories)
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning when sarif-upload is true
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the commits with gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [[ -n "${BASE_SHA}" && -n "${HEAD_SHA}" ]]; then
            log_opts=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          else
            echo "No pull request range: scanning the full history"
          fi
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${RUNNER_TEMP}/gitleaks:/out" \
            "${GITLEAKS_IMAGE}" git "${log_opts[@]}" \
            --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path /out/results.sarif /repo

      - name: Upload the gitleaks SARIF to code scanning
        if: inputs.sarif-upload
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks/results.sarif
          category: gitleaks

      - name: Fail when leaks were found
        run: |
          count="$(jq '.runs[0].results | length' "${RUNNER_TEMP}/gitleaks/results.sarif")"
          if [[ "${count}" -gt 0 ]]; then
            echo "::error::gitleaks found ${count} potential secret(s); see the job log (values are redacted)"
            exit 1
          fi
          echo "gitleaks: no leaks found"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning when sarif-upload is true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows
          # With upload enabled the action uploads SARIF itself and does not fail on findings
          # (code scanning is the gate); without it, findings are annotated and fail the job.
          advanced-security: ${{ inputs.sarif-upload }}
          annotations: ${{ !inputs.sarif-upload }}

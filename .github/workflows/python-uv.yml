name: python-uv

# Reusable: quality gates of a uv-managed Python project. uv sync --frozen, ruff check,
# ruff format --check, mypy, pytest with the coverage gate on SQLite plus one job per
# PostgreSQL version as a service container, pip-audit on the exported lock.
#
# PostgreSQL jobs export libpq's PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE and
# TEST_DATABASE_URL (postgresql://...); the project's test setup reads them.
#
# Status check names: <caller job id> / lint and types, <caller job id> / tests (sqlite),
#   <caller job id> / tests (postgresql <version>), <caller job id> / dependency audit
# Caller permissions: contents: read
# Caller secrets: GIT_READ_TOKEN when git-credentials is true

on:
  workflow_call:
    inputs:
      test-timeout-minutes:
        description: Upper bound of each test job, in minutes (a hung test fails instead of running 6 hours)
        type: number
        required: false
        default: 30
      runs-on:
        description: Runner label for the jobs that can run on a self-hosted runner (callers pass their RUNNER_LABEL repository variable, ADR 0010 of platform-infra); empty means ubuntu-latest
        type: string
        required: false
        default: ""
      python-version:
        description: Python version for uv (empty = the project's .python-version or requires-python)
        type: string
        required: false
        default: ""
      postgres-versions:
        description: JSON list of PostgreSQL major versions to test against, one job each (empty list = none)
        type: string
        required: false
        default: "[]"
      coverage-threshold:
        description: Minimum total coverage percentage for pytest --cov-fail-under
        type: number
        required: false
        default: 80
      working-directory:
        description: Directory holding pyproject.toml and uv.lock
        type: string
        required: false
        default: "."
      playwright-browsers:
        description: Comma-separated Playwright browsers to install with their system dependencies before pytest (empty = do not install)
        type: string
        required: false
        default: ""
      apt-packages:
        description: Space-separated Debian packages installed with apt before pytest (e.g. ffmpeg); empty = none
        type: string
        required: false
        default: ""
      git-credentials:
        description: Configure git to use the GIT_READ_TOKEN secret for private git dependencies before uv sync
        type: boolean
        required: false
        default: false
    secrets:
      GIT_READ_TOKEN:
        description: Fine-grained token with Contents read on the private git dependencies (used when git-credentials is true)
        required: false

permissions: {}

env:
  UV_PYTHON: ${{ inputs.python-version }}
  PIP_AUDIT_VERSION: 2.10.1

jobs:
  lint:
    name: lint and types
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure git credentials for private dependencies
        if: inputs.git-credentials
        env:
          GIT_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}
        run: |
          if [[ -z "${GIT_READ_TOKEN}" ]]; then
            echo "::error::git-credentials is true but the GIT_READ_TOKEN secret is empty"; exit 1
          fi
          git config --global "url.https://x-access-token:${GIT_READ_TOKEN}@github.com/.insteadOf" "https://github.com/"

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

  test-sqlite:
    name: tests (sqlite)
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the 6-hour GitHub default.
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure git credentials for private dependencies
        if: inputs.git-credentials
        env:
          GIT_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}
        run: |
          if [[ -z "${GIT_READ_TOKEN}" ]]; then
            echo "::error::git-credentials is true but the GIT_READ_TOKEN secret is empty"; exit 1
          fi
          git config --global "url.https://x-access-token:${GIT_READ_TOKEN}@github.com/.insteadOf" "https://github.com/"

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Install the system packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          for package in ${PACKAGES}; do
            [[ "${package}" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::invalid package name '${package}'"; exit 1; }
          done
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # one argument per validated package name on purpose
          sudo apt-get install -y -qq --no-install-recommends ${PACKAGES}

      - name: Install the Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          # shellcheck disable=SC2086 # the comma list becomes one argument per browser on purpose
          uv run playwright install --with-deps ${BROWSERS//,/ }

      - name: Pytest with the coverage gate
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: >-
          uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under="${COVERAGE_THRESHOLD}" --junitxml=junit.xml

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-sqlite
          path: |
            ${{ inputs.working-directory }}/junit.xml
            ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore

  test-postgres:
    name: tests (postgresql ${{ matrix.postgres }})
    if: inputs.postgres-versions != '' && inputs.postgres-versions != '[]'
    # GitHub-hosted on purpose: PostgreSQL service containers need Docker (ADR 0010).
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the 6-hour GitHub default.
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(inputs.postgres-versions || '[]') }}
    services:
      postgres:
        # The major version is chosen by the caller, so the official image is tag-pinned
        # (docs/required-checks.md, pitfalls): a digest cannot cover a matrix of versions.
        image: docker.io/library/postgres:${{ matrix.postgres }}-alpine # zizmor: ignore[unpinned-images] version comes from the caller matrix
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # throwaway credential of an ephemeral service container
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ci_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure git credentials for private dependencies
        if: inputs.git-credentials
        env:
          GIT_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}
        run: |
          if [[ -z "${GIT_READ_TOKEN}" ]]; then
            echo "::error::git-credentials is true but the GIT_READ_TOKEN secret is empty"; exit 1
          fi
          git config --global "url.https://x-access-token:${GIT_READ_TOKEN}@github.com/.insteadOf" "https://github.com/"

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Install the system packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          for package in ${PACKAGES}; do
            [[ "${package}" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::invalid package name '${package}'"; exit 1; }
          done
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # one argument per validated package name on purpose
          sudo apt-get install -y -qq --no-install-recommends ${PACKAGES}

      - name: Install the Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          # shellcheck disable=SC2086 # the comma list becomes one argument per browser on purpose
          uv run playwright install --with-deps ${BROWSERS//,/ }

      - name: Pytest with the coverage gate
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: >-
          uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under="${COVERAGE_THRESHOLD}" --junitxml=junit.xml

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-postgresql-${{ matrix.postgres }}
          path: |
            ${{ inputs.working-directory }}/junit.xml
            ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore

  audit:
    name: dependency audit
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Export the lock as hashed requirements
        run: >-
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt
          --output-file "${RUNNER_TEMP}/requirements.txt"

      - name: pip-audit the exported lock
        run: uvx "pip-audit==${PIP_AUDIT_VERSION}" --requirement "${RUNNER_TEMP}/requirements.txt" --require-hashes --disable-pip

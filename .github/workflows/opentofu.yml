name: opentofu

# Reusable: static checks of an OpenTofu root module or module directory: tofu fmt -check,
# tofu validate (init without backend), tofu test when run-tests is true, tflint.
# Nothing is planned or applied.
#
# Status check name: <caller job id> / opentofu
# Caller permissions: contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the jobs that can run on a self-hosted runner (callers pass their RUNNER_LABEL repository variable, ADR 0010 of platform-infra); empty means ubuntu-latest
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory holding the OpenTofu configuration
        type: string
        required: false
        default: "."
      tofu-version:
        description: OpenTofu version (without the v)
        type: string
        required: false
        default: 1.12.6
      run-tests:
        description: Run tofu test (needs the providers the tests use, mocked or real)
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: Upper bound of the check job, in minutes (raise it for long tofu test suites)
        type: number
        required: false
        default: 15

permissions: {}

env:
  TFLINT_VERSION: v0.64.0

jobs:
  check:
    name: opentofu
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: $/actions/setup-tools
        with:
          tools: tofu
          tofu-version: ${{ inputs.tofu-version }}

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu init (no backend)
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

      - name: tofu test
        if: inputs.run-tests
        run: tofu test

      - name: Install tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          tflint_wrapper: false

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads declared in .tflint.hcl, avoids API rate limits
        run: |
          tflint --init
          tflint --format compact --recursive

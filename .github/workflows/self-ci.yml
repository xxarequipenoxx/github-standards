name: self-ci

# CI of this repository. No branch filter on purpose: milestone pull requests are stacked
# (S1 targets the S0 branch), so every pull request must run the checks, not only those
# targeting main. The rulesets only require the checks on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: self-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Retries with curl's exponential backoff; the checksum is checked from a file.
          curl --silent --show-error --fail --location --connect-timeout 20 --max-time 300 \
            --retry 5 --retry-all-errors --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${RUNNER_TEMP}/${archive}" > "${RUNNER_TEMP}/${archive}.sha256"
          sha256sum --check --strict "${RUNNER_TEMP}/${archive}.sha256"
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          inputs: .github/workflows
          # Private repositories on GitHub Pro have no Advanced Security, so findings are
          # reported as annotations and fail the job instead of going to the security tab.
          advanced-security: false
          annotations: true

  # Fixture coverage: the repository's own pull requests run the reusable workflows.
  commits:
    uses: ./.github/workflows/commits.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
      pull-requests: read # caller contract of commits.yml (README section 7)

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
      security-events: write # caller contract of security.yml (README section 7)

  # Not a required check: it only turns auto-merge on or off (README section 7).
  auto-merge:
    uses: ./.github/workflows/auto-merge.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
    secrets:
      token: ${{ secrets.AUTO_MERGE_TOKEN }}

  # S2 fixtures (tests/fixtures): every language, container and manifest workflow runs on a
  # minimal project of its own. Nothing is pushed to a registry: push is false and the
  # container digest chains into the manifests fixture.
  python:
    uses: ./.github/workflows/python-uv.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-uv
      postgres-versions: '["17"]'
      apt-packages: tree # exercises the apt input with a tiny package
      coverage-threshold: 70 # the PostgreSQL branch is uncovered on SQLite

  container:
    uses: ./.github/workflows/container.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
      packages: write # caller contract of container.yml even with push false (README section 7)
    with:
      image-name: fixture-container
      version: 0.0.0
      context: tests/fixtures/container
      dockerfile: tests/fixtures/container/Dockerfile
      push: false
      build-secrets: fixture_token=fixture-placeholder-value # exercises the BuildKit secret mount, not a credential

  manifests:
    needs: container
    uses: ./.github/workflows/oci-manifests.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
      packages: write # caller contract of oci-manifests.yml even with push false (README section 7)
    with:
      image-name: fixture-container
      image-digest: ${{ needs.container.outputs.digest }}
      version: 0.0.0
      path: tests/fixtures/kustomize
      overlay: overlays/ci
      artifact-name: fixture-deploy
      push: false

  opentofu:
    uses: ./.github/workflows/opentofu.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/opentofu

  kubernetes:
    uses: ./.github/workflows/kubernetes-manifests.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
    with:
      paths: '["tests/fixtures/kustomize/overlays/ci"]'

  # S3: repositories as code (terraform/). Static checks and the mocked tofu test only; no
  # token is available here and nothing is ever planned or applied against GitHub.
  terraform:
    uses: ./.github/workflows/opentofu.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not parse the $/ form yet
    permissions:
      contents: read
    with:
      working-directory: terraform
      run-tests: true

  # S4: shared pre-commit hooks (hooks/) and the new-repo script (scripts/).
  hooks:
    name: hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck on the scripts
        run: shellcheck hooks/*.sh scripts/*.sh tests/hooks/*.sh

      - name: Run the hook tests
        run: bash tests/hooks/run.sh

      - name: Check for early-closing pipe consumers (SIGPIPE under pipefail)
        run: bash scripts/check-pipes.sh

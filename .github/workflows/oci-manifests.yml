name: oci-manifests

# Reusable: publish Kubernetes manifests as a Flux OCI artifact with the released image
# pinned by digest. The `path` directory is copied to a scratch directory, the image is set
# in `overlay` with `kustomize edit set image ghcr.io/<owner>/<image-name>=<image>@<digest>`
# (the base manifests reference the image by that full name), the overlay is rendered and
# validated with kubeconform -strict, then pushed with
# `flux push artifact oci://ghcr.io/<owner>/<artifact-name>:<version> --source --revision`.
# Nothing is committed back. With `push` false the artifact is built locally instead
# (flux build artifact) and no registry write happens. `sign` signs the pushed artifact
# keyless with cosign.
#
# Status check names: <caller job id> / oci manifests, <caller job id> / oci manifests sign
# Caller permissions: contents: read, packages: write, id-token: write when signing

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under ghcr.io/<owner>/ referenced by the manifests
        type: string
        required: true
      image-digest:
        description: Image digest to pin, sha256:<hex>
        type: string
        required: true
      version:
        description: Artifact tag and revision, X.Y.Z without the leading v
        type: string
        required: true
      path:
        description: Directory holding the manifests to publish
        type: string
        required: false
        default: deploy
      overlay:
        description: Kustomize overlay directory relative to path where the image is pinned
        type: string
        required: true
      artifact-name:
        description: Artifact name under ghcr.io/<owner>/
        type: string
        required: true
      crd-schema-locations:
        description: Extra kubeconform -schema-location values for CRDs, one per line
        type: string
        required: false
        default: ""
      sign:
        description: Sign the pushed artifact keyless with cosign (needs id-token write from the caller)
        type: boolean
        required: false
        default: false
      push:
        description: Push the artifact to GHCR (false builds it locally without any registry write)
        type: boolean
        required: false
        default: true
    outputs:
      artifact:
        description: Artifact reference, oci://ghcr.io/<owner>/<artifact-name>:<version>
        value: ${{ jobs.publish.outputs.artifact }}

# No workflow-level permissions on purpose: the sign job inherits the caller's grants (see
# the job). Every other job declares its own least-privilege block.

jobs:
  publish:
    name: oci manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the artifact to GHCR (unused when push is false)
    outputs:
      artifact: ${{ steps.reference.outputs.artifact }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize, kubeconform and flux
        uses: $/actions/setup-tools
        with:
          tools: kustomize kubeconform flux

      - name: Lowercase the owner for the OCI references
        id: owner
        uses: $/actions/lowercase

      - name: Compute the references
        id: reference
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image-digest must be sha256:<64 hex> (got '${IMAGE_DIGEST}')"; exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z without the leading v (got '${VERSION}')"; exit 1
          fi
          for name in "${IMAGE_NAME}" "${ARTIFACT_NAME}"; do
            if [[ "${name}" != "${name,,}" ]]; then
              echo "::error::OCI names must be lowercase (got '${name}')"; exit 1
            fi
          done
          {
            echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}"
            echo "repository=ghcr.io/${OWNER}/${ARTIFACT_NAME}"
            echo "artifact=oci://ghcr.io/${OWNER}/${ARTIFACT_NAME}:${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Pin the image digest in the overlay
        env:
          MANIFESTS_PATH: ${{ inputs.path }}
          OVERLAY: ${{ inputs.overlay }}
          IMAGE: ${{ steps.reference.outputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          if [[ ! -d "${MANIFESTS_PATH}/${OVERLAY}" ]]; then
            echo "::error::overlay directory '${MANIFESTS_PATH}/${OVERLAY}' not found"; exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp -a "${MANIFESTS_PATH}/." "${RUNNER_TEMP}/artifact/"
          cd "${RUNNER_TEMP}/artifact/${OVERLAY}"
          kustomize edit set image "${IMAGE}=${IMAGE}@${IMAGE_DIGEST}"
          echo "Overlay kustomization after pinning:"
          cat kustomization.yaml

      - name: Render the overlay and validate it with kubeconform
        env:
          OVERLAY: ${{ inputs.overlay }}
          IMAGE: ${{ steps.reference.outputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          CRD_SCHEMA_LOCATIONS: ${{ inputs.crd-schema-locations }}
        run: |
          schema_opts=(-schema-location default)
          while IFS= read -r location; do
            [[ -n "${location}" ]] && schema_opts+=(-schema-location "${location}")
          done <<< "${CRD_SCHEMA_LOCATIONS}"
          rendered="${RUNNER_TEMP}/rendered.yaml"
          kustomize build "${RUNNER_TEMP}/artifact/${OVERLAY}" > "${rendered}"
          if ! grep -Fq "${IMAGE}@${IMAGE_DIGEST}" "${rendered}"; then
            echo "::error::the rendered overlay does not reference ${IMAGE}@${IMAGE_DIGEST}; the base must use that image name"; exit 1
          fi
          # SOPS-encrypted Secrets carry a `sops` metadata block that strict validation rejects.
          kubeconform -strict -summary -skip Secret "${schema_opts[@]}" "${rendered}"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the artifact
        id: push
        if: inputs.push
        env:
          ARTIFACT: ${{ steps.reference.outputs.artifact }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          result="$(flux push artifact "${ARTIFACT}" \
            --path="${RUNNER_TEMP}/artifact" \
            --source="${SOURCE}" \
            --revision="v${VERSION}@sha1:${SHA}" \
            --output json)"
          echo "${result}"
          echo "digest=$(jq -r '.digest' <<< "${result}")" >> "${GITHUB_OUTPUT}"

      - name: Build the artifact locally
        if: ${{ !inputs.push }}
        run: |
          flux build artifact --path="${RUNNER_TEMP}/artifact" --output="${RUNNER_TEMP}/artifact.tgz"
          echo "Artifact contents:"
          tar -tzf "${RUNNER_TEMP}/artifact.tgz"

      - name: Report the result
        env:
          ARTIFACT: ${{ steps.reference.outputs.artifact }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.reference.outputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "## OCI manifests"
            echo
            echo "- artifact: \`${ARTIFACT}\`${DIGEST:+ (\`${DIGEST}\`)}"
            echo "- pushed: ${PUSHED}"
            echo "- image pinned: \`${IMAGE}@${IMAGE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  sign:
    name: oci manifests sign
    if: inputs.sign && inputs.push
    # No permissions block on purpose: GitHub validates a called job's permissions against the
    # caller's grants when the run is planned, even when the job is skipped, so declaring
    # id-token write here would break every caller that does not sign. The job inherits the
    # caller's grants instead: packages write and id-token write when signing (README section 7).
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign the artifact by digest
        env:
          ARTIFACT: ${{ needs.publish.outputs.artifact }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          repository="${ARTIFACT#oci://}"
          repository="${repository%:*}"
          cosign sign --yes "${repository}@${DIGEST}"

name: container

# Reusable: build a container image with BuildKit and push it to GHCR as
# ghcr.io/<lowercased owner>/<image-name> with the tags X.Y.Z, X.Y and sha-<short>, with SBOM
# and provenance attestations; expose the image name and digest as outputs; sign the image
# keyless with cosign when `sign` is true. With `push` false (pull request builds, fixtures)
# the image is built with the same exporter but kept in the build cache: no registry write,
# the digest is still computed and returned.
#
# Build-time secrets (for example a git token read through RUN --mount=type=secret) are
# forwarded verbatim to docker/build-push-action `secrets:`; they never end up in a layer.
#
# Status check names: <caller job id> / container build, <caller job id> / container sign
# Caller permissions: contents: read, packages: write, id-token: write when signing
# Caller secrets: none required; pass build secrets through the build-secrets input

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under ghcr.io/<owner>/ (lowercase)
        type: string
        required: true
      version:
        description: Version to tag, X.Y.Z without the leading v
        type: string
        required: true
      context:
        description: Build context directory
        type: string
        required: false
        default: "."
      dockerfile:
        description: Dockerfile path relative to the repository root
        type: string
        required: false
        default: Dockerfile
      platforms:
        description: Comma-separated target platforms
        type: string
        required: false
        default: linux/amd64
      sign:
        description: Sign the pushed image keyless with cosign (needs id-token write from the caller)
        type: boolean
        required: false
        default: false
      build-secrets:
        description: Build secrets forwarded to docker/build-push-action, one id=value per line (pass a secrets expression)
        type: string
        required: false
        default: ""
      push:
        description: Push the image to GHCR (false builds without any registry write)
        type: boolean
        required: false
        default: true
    outputs:
      image:
        description: Image reference without tag, ghcr.io/<owner>/<image-name>
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image digest, sha256:<hex>
        value: ${{ jobs.build.outputs.digest }}

# No workflow-level permissions on purpose: the sign job inherits the caller's grants (see
# the job). Every other job declares its own least-privilege block.

jobs:
  build:
    name: container build
    # GitHub-hosted on purpose: Docker, QEMU and buildx need a privileged daemon (ADR 0010).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR (unused when push is false)
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase the owner for the OCI reference
        id: owner
        uses: $/actions/lowercase

      - name: Compute the image reference
        id: image
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${IMAGE_NAME}" != "${IMAGE_NAME,,}" ]]; then
            echo "::error::image-name must be lowercase (got '${IMAGE_NAME}')"; exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z without the leading v (got '${VERSION}')"; exit 1
          fi
          echo "name=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU for foreign platforms
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false # the contract is X.Y.Z, X.Y and sha-<short>; never a moving latest tag
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=sha

      - name: Build the image with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          outputs: type=image,push=${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          secrets: ${{ inputs.build-secrets }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the result
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ inputs.push }}
        run: |
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::the build produced no digest"; exit 1
          fi
          {
            echo "## Container image"
            echo
            echo "- image: \`${IMAGE}@${DIGEST}\`"
            echo "- pushed: ${PUSHED}"
            echo "- tags:"
            while IFS= read -r tag; do echo "  - ${tag}"; done <<< "${TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  sign:
    name: container sign
    if: inputs.sign && inputs.push
    # No permissions block on purpose: GitHub validates a called job's permissions against the
    # caller's grants when the run is planned, even when the job is skipped, so declaring
    # id-token write here would break every caller that does not sign. The job inherits the
    # caller's grants instead: packages write and id-token write when signing (README section 7).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign the image by digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
